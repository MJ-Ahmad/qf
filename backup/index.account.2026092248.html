  <style>
    :root {
      --night: #0a3a31;
      --night-deep: #06251f;
      --emerald: #136b55;
      --gold: #b8892d;
      --gold-soft: #ead9a6;
      --background: #f1f5f0;
      --card: #ffffff;
      --ink: #15221d;
      --muted: #586a62;
      --line: #d5ddd3;
      --danger: #8e2f2f;
      --danger-bg: #fff2f0;
      --success: #176b4d;
      --serif: "Tiro Bangla", Georgia, serif;
      --sans: "Hind Siliguri", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0c1a16;
        --card: #12261f;
        --ink: #e6efe9;
        --muted: #9db1a7;
        --line: #244036;
        --danger-bg: #321b18;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font: 16px/1.75 var(--sans);
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .container {
      width: min(1120px, calc(100% - 36px));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-row {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--night);
      text-decoration: none;
    }

    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 1.08rem;
      font-weight: 700;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .header-links a {
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      color: var(--emerald);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }

    .header-links a:hover {
      color: var(--night);
      background: var(--background);
    }

    .langbar {
      display: inline-flex;
      gap: 0.2rem;
      padding: 0.22rem;
      border-radius: 999px;
      background: var(--night);
    }

    .langbar button {
      min-width: 48px;
      border: 0;
      border-radius: 999px;
      padding: 0.28rem 0.6rem;
      color: var(--gold-soft);
      background: transparent;
      cursor: pointer;
      font: 600 0.82rem var(--sans);
    }

    .langbar button[aria-pressed="true"] {
      color: var(--night);
      background: var(--gold-soft);
    }

    .hero {
      padding: 4.5rem 1rem 3.5rem;
      color: #ffffff;
      text-align: center;
      background:
        linear-gradient(
          rgba(6, 37, 31, 0.74),
          rgba(6, 37, 31, 0.92)
        ),
        url("/qf/assets/header_resized/01.jpg")
        center / cover no-repeat;
    }

    .hero-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 1rem;
      padding: 0.5rem;
      border-radius: 16px;
      background: #ffffff;
    }

    .eyebrow {
      margin: 0 0 0.45rem;
      color: var(--gold-soft);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .hero h1 {
      max-width: 840px;
      margin: 0 auto 1rem;
      font: 400 clamp(2rem, 5vw, 3.2rem)/1.35 var(--serif);
    }

    .hero p {
      max-width: 780px;
      margin: 0 auto;
      color: #e8f1ec;
      font-size: 1.05rem;
    }

    .section {
      padding: 4rem 0;
    }

    .section--soft {
      border-block: 1px solid var(--line);
      background: var(--card);
    }

    .section-heading {
      max-width: 820px;
      margin: 0 auto 2rem;
      text-align: center;
    }

    .section-heading h2 {
      margin: 0 0 0.5rem;
      color: var(--night);
      font: 400 clamp(1.7rem, 4vw, 2.35rem)/1.4 var(--serif);
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
    }

    .notice {
      max-width: 960px;
      margin: 0 auto 1.5rem;
      padding: 1rem 1.15rem;
      border: 1px solid var(--gold);
      border-radius: 10px;
      color: var(--ink);
      background: rgba(234, 217, 166, 0.22);
    }

    .notice strong {
      color: var(--night);
    }

    .notice p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .account-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .account-card {
      padding: 1.35rem;
      border: 1px solid var(--line);
      border-top: 3px solid var(--gold);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 10px 28px rgba(2, 35, 27, 0.05);
    }

    .account-card h3 {
      margin: 0 0 1rem;
      color: var(--night);
      font-size: 1.2rem;
    }

    .account-row {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 0.8rem;
      align-items: start;
      padding: 0.55rem 0;
      border-bottom: 1px dashed var(--line);
    }

    .account-row:last-of-type {
      border-bottom: 0;
    }

    .account-label {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .account-value {
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 700;
      word-break: break-word;
    }

    .account-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .copy-button {
      min-height: 38px;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--emerald);
      border-radius: 999px;
      color: var(--emerald);
      background: transparent;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .copy-button:hover {
      color: #ffffff;
      background: var(--emerald);
    }

    .mobile-card {
      padding: 1.35rem;
      border: 1px solid var(--line);
      border-top: 3px solid var(--emerald);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 10px 28px rgba(2, 35, 27, 0.05);
    }

    .mobile-card h3 {
      margin: 0 0 0.65rem;
      color: var(--night);
      font-size: 1.2rem;
    }

    .mobile-card p {
      margin: 0 0 0.8rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mobile-number {
      display: block;
      margin-bottom: 0.8rem;
      color: var(--night);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .how-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }

    .how-card {
      padding: 1.2rem;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--card);
    }

    .how-number {
      display: grid;
      width: 40px;
      height: 40px;
      margin-bottom: 0.7rem;
      place-items: center;
      border-radius: 50%;
      color: var(--night);
      background: var(--gold-soft);
      font-weight: 700;
    }

    .how-card h3 {
      margin: 0 0 0.4rem;
      color: var(--night);
      font-size: 1.05rem;
    }

    .how-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .security-box {
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 1.4rem;
      border: 1px solid var(--danger);
      border-radius: 12px;
      color: var(--danger);
      background: var(--danger-bg);
    }

    .security-box h2 {
      margin: 0 0 0.4rem;
      font-size: 1.15rem;
    }

    .security-box p {
      margin: 0;
      font-size: 0.93rem;
    }

    .cta-box {
      max-width: 820px;
      margin: 0 auto;
;
      border-radius: 15px;
      color: #ffffff;
      background: var(--night);
      text-align: center;
    }

    .cta-box h2 {
      margin: 0 0 0.5rem;
      color: var(--gold-soft);
      font: 400 1.75rem/1.4 var(--serif);
    }

    .cta-box p {
      margin: 0 0 1rem;
      color: #dbe9e1;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      color: #1b1204;
      background: var(--gold);
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover {
      filter: brightness(1.08);
    }

    .site-footer {
      padding: 3rem 0 1.2rem;
      color: #cfe0d8;
      background: var(--night-deep);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr repeat(4, 1fr);
      gap: 1.5rem;
    }

    .footer-brand p {
      margin: 0.8rem 0 0;
      color: #footer-col h2 {
      margin: 0 0 0.75rem;
      color: var(--gold-soft);
      font-size: 0.96rem;
    }

    .footer-col a {
      display: block;
      margin-bottom: 0.45rem;
      color: #cfe0d8;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .footer-col a:hover {
      color: var(--gold);
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-topfb6ac;
      font-size: 0.84rem;
    }

    .footer-bottom p {
      margin: 0;
    }

    .footer-bottom a {
      color: var(--gold-soft);
      text-decoration: none;
    }

    .footer-legal {
      text-align: right;
    }

    .footer-legal a {
      color: #cfe0d8;
    }

    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 50;
      max-width: 320px;
      padding: 0.7px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-size: 0.9rem;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 950px) {
      .header-row {
        padding-block: 0.65rem;
      }

      .account-grid {
        grid-template-columns: 1fr;
      }

      .how-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .footer-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer-brand {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 720px) {
      .account-row {
        grid-template-columns: 1fr;
        gap: 0.1rem;
      }

      .footer-bottom {
        flex-direction: column;
      }

      .footer-legal {
        text-align: left;
      }
    }

    @media (max-width: 480px) {
      .container {
        width: min(100% - 28px, 560px);
      }

      .how-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .footer-brand {
        grid-column: auto;
      }

        </span>
      </a>

  <div
    id="copyToast"
    class="toast"
    role="status <script>
    (function () {
      const defaultLanguage = 'bn';

      function getLanguage() {
        try {
          const saved = localStorage.getItem('qf-lang');

          return saved === 'en' || saved === 'bn'
            ? saved
            : defaultLanguage;
        } catch (error) {
          return defaultLanguage;
        }
      }

      function setLanguage(language) {
        const selectedLanguage =
          language === 'en' ? 'en' : 'bn';

        document
          .querySelectorAll('[data-bn][data-en]')
          .forEach(function (element) {
            const text =
              selectedLanguage === 'en'
                ? element.getAttribute('data-en')
                : element.getAttribute('data-bn');

            if (text !== null) {
              element.textContent = text;
            }
          });

        document.documentElement.lang =
          selectedLanguage;

        document.documentElement.dataset.lang =
          selectedLanguage;

        document
          .querySelectorAll('[data-lang-button]')
          .forEach(function (button) {
            button.setAttribute(
              'aria-pressed',
              String(
                button.getAttribute('data-lang-button') ===
                selectedLanguage
              )
            );
          });

        try {
          localStorage.setItem(
            'qf-lang',
            selectedLanguage
          );
        } catch (error) {
          console.warn(
            'Language preference could not be saved.',
            error
          );
        }
      }

      function showToast(message) {
        const toast =
          document.getElementById('copyToast');

        if (!toast) return;

        toast.textContent = message;
        toast.classList.add('show');

        window.clearTimeout(
          showToast.timeout
        );

        showToast.timeout =
          window.setTimeout(function () {
            toast.classList.remove('show');
          }, 2200);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);

          showToast(
            document.documentElement.lang === 'en'
              ? 'Account details copied.'
              : 'হিসাবের তথ্য কপি হয়েছে।'
          );
        } catch (error) {
          const textarea =
            document.createElement('textarea');

          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';

          document.body.append =
            document.execCommand('copy');

          textarea.remove();

                ? 'Account details copied.'
                : 'হিসাবের তথ্য কপি হয়েছে।'
              : document.documentElement.lang === 'en'
                ? 'Copy failed. Please copy manually.'
                : 'কপি করা যায়নি। অনুগ্রহ করে নিজে কপি করুন।'
          );
        }
      }

      document.addEventListener(
        'DOMContentLoaded',
        function () {
          setLanguage(getLanguage());

          document
            .querySelectorAll('[data-lang-button]')
            .forEach(function (button) {
              button.addEventListener(
                'click',
                function () {
                  setLanguage(
                    button.getAttribute(
                      'data-lang-button'
                    )
                  );
                }
              );
            });

          document
            .querySelectorAll('[data-copy]')
            .forEach(function (button) {
              button.addEventListener(
                'click',
                function () {
                  copyText(
                    button.getAttribute('data-copy')
                  );
                }
              );
            });

          const year =
            document.getElementById('footerYear');

          if (year) {
            year.textContent =
              new Date().getFullYear();
          }
        }
      );
    })();
  </script>
