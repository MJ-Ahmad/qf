<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="গবেষণা • মুদ্রণ • বিতরণ — পবিত্র কোরআনের সেবায় বাংলাদেশের একটি প্রতিষ্ঠান">
<link rel="icon" href="https://mj-ahmad.github.io/qf/assets/logo.png" sizes="any">
<title>কোরআনের ফেরিওয়ালা — QuranerFariwala</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--night:#0a3a31;--em:#136b55;--gold:#b8892d;--gsoft:#ead9a6;--bg:#f1f5f0;--card:#fff;--ink:#15221d;--muted:#586a62;--line:#d5ddd3;--serif:'Tiro Bangla',Georgia,serif;--sans:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a16;--card:#12261f;--ink:#e6efe9;--muted:#9db1a7;--line:#244036}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans)}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:34px;height:34px;border-radius:6px}
.brand-name{font:600 1.15rem var(--sans);color:var(--night)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:999px;text-decoration:none;font-weight:600;color:var(--em);font-size:.95rem}
nav a:hover{background:var(--bg)}
nav a.gold{background:var(--night);color:var(--gsoft)}
.langbar{display:flex;gap:2px;padding:3px;background:var(--night);border-radius:999px}
.langbar button{border:0;background:none;color:var(--gsoft);border-radius:999px;padding:3px 12px;font:.85rem var(--sans);cursor:pointer}
.langbar button[aria-pressed="true"]{background:var(--gsoft);color:var(--night);font-weight:600}
.hero{text-align:center;padding:56px 18px 40px;background:radial-gradient(120% 90% at 50% 0,#12604e,var(--night) 70%);color:#fff}
.hero img{width:64px;height:64px;border-radius:12px;background:#fff;padding:6px;margin-bottom:14px}
.epigraph{font:italic 1.3rem/1.7 var(--serif);color:var(--gsoft);margin:0}
.epigraph-ref{color:rgba(234,217,166,.75);font-size:.9rem;margin:2px 0 22px}
.hero h1{font:400 clamp(2rem,6vw,3rem)/1.3 var(--serif);margin:0 0 14px}
.hero p{max-width:640px;margin:0 auto 26px;color:#e8f1ec;font-size:1.05rem}
.btn{display:inline-block;padding:12px 30px;border-radius:999px;background:var(--gold);color:#1b1204;font-weight:700;text-decoration:none}
.ledger{background:var(--night);padding:26px 18px}
.ledger .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;text-align:center}
.ledger b{display:block;font:400 2rem var(--serif);color:var(--gold)}
.ledger span{color:var(--gsoft);font-size:.9rem}
section.pad{padding:52px 18px}
.section-head{text-align:center;margin-bottom:28px}
.section-head h2{font:400 1.8rem var(--serif);color:var(--night);margin:0 0 6px}
.section-head p{color:var(--muted);margin:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;max-width:1080px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:22px}
.card h3{margin:0 0 8px;font:600 1.15rem var(--sans);color:var(--night)}
.card p{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.card a{font-weight:700;color:var(--em);text-decoration:none;font-size:.92rem}
.support{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.portal-box{max-width:640px;margin:0 auto;text-align:center;background:linear-gradient(180deg,var(--night),#0e4a3e);color:#fff;border-radius:12px;padding:40px 24px;border:1px solid var(--gold)}
.portal-box h2{font:400 1.6rem var(--serif);margin:0 0 4px}
.portal-box .en{color:var(--gsoft);font-size:.9rem}
.portal-box p{color:#e8f1ec;margin:14px 0 22px}
footer{background:var(--night);color:#cfe0d8;padding:40px 18px 20px}
.foot-grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:24px}
.foot-brand p{color:#9fb6ac;font-size:.9rem;margin-top:10px}
.foot-col h4{color:var(--gsoft);font:600 .92rem var(--sans);margin:0 0 10px}
.foot-col a,.foot-col span{display:block;color:#cfe0d8;text-decoration:none;font-size:.9rem;margin-bottom:8px}
.foot-col a:hover{color:var(--gold)}
.soon{opacity:.55;cursor:default}
.soon-badge{font-size:.72rem;background:rgba(234,217,166,.15);border:1px solid var(--gsoft);color:var(--gsoft);border-radius:999px;padding:0 7px;margin-left:6px}
.foot-bottom{max-width:1080px;margin:26px auto 0;padding-top:16px;border-top:1px solid rgba(234,217,166,.15);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.85rem;color:#9fb6ac}
@media(max-width:820px){.foot-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap head-row">
  <a class="brand" href="."><img id="logo1" alt=""><span class="brand-name">কোরআনের ফেরিওয়ালা</span></a>
  <nav>
    <a href="#research">গবেষণা</a><a href="#printing">মুদ্রণ</a><a href="#distribution">বিতরণ</a>
    <a class="gold" href="portal/">পোর্টাল</a>
  </nav>
  <div class="langbar" role="group" aria-label="Language">
    <button id="lBn" type="button" aria-pressed="true">বাংলা</button>
    <button id="lEn" type="button" aria-pressed="false">EN</button>
  </div>
</div></header>

<section class="hero">
  <img id="logo2" alt="">
  <p class="epigraph" id="epigraph"></p>
  <p class="epigraph-ref" id="epigraphRef"></p>
  <h1 id="heroTitle"></h1>
  <p id="heroLead"></p>
  <a class="btn" id="heroCta" href="portal/"></a>
</section>

<section class="ledger"><div class="wrap" id="ledgerStrip"></div></section>

<section class="pad" id="chaptersSec">
  <div class="section-head"><h2 id="chaptersHead"></h2></div>
  <div class="grid3" id="chapters"></div>
</section>

<section class="pad support">
  <div class="section-head"><h2 id="supportHead"></h2><p id="supportLead"></p></div>
  <div class="grid3" id="supportGrid"></div>
</section>

<section class="pad">
  <div class="portal-box">
    <h2 id="portalTitle"></h2><div class="en" id="portalTitleEn"></div>
    <p id="portalDesc"></p>
    <a class="btn" id="portalCta" href="portal/"></a>
  </div>
</section>

<footer>
  <div class="foot-grid">
    <div class="foot-brand">
      <a class="brand" href="." style="color:#fff"><img id="logo3" alt="" style="width:30px;height:30px"><span class="brand-name" style="color:#fff">কোরআনের ফেরিওয়ালা</span></a>
      <p id="footerNote"></p>
    </div>
    <div id="footerCols" style="display:contents"></div>
  </div>
  <div class="foot-bottom">
    <div id="footerCredit"></div>
    <div id="footerLegal"></div>
  </div>
</footer>

<script>
let D=null,lang='bn';
const $=id=>document.getElementById(id);
const T=v=>v==null?'':typeof v==='object'?(v[lang]??v.bn??''):v;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  document.documentElement.lang=lang;document.title=T(D.site.title);
  $('lBn').setAttribute('aria-pressed',lang==='bn');$('lEn').setAttribute('aria-pressed',lang==='en');
  ['logo1','logo2','logo3'].forEach(id=>{$(id).src=D.site.logo;$(id).alt=T(D.site.logoAlt)});
  const nav=document.querySelectorAll('header nav a');
  nav[0].textContent=T(D.nav.research);nav[1].textContent=T(D.nav.printing);nav[2].textContent=T(D.nav.distribution);nav[3].textContent=T(D.nav.portal);

  $('epigraph').textContent=D.hero.epigraph;
  $('epigraphRef').textContent=T(D.hero.epigraphRef);
  $('heroTitle').textContent=T(D.hero.title);
  $('heroLead').textContent=T(D.hero.lead);
  $('heroCta').textContent=T(D.hero.cta);

  $('ledgerStrip').innerHTML=D.ledger.map(l=>`<div><b>${lang==='bn'?l.value:l.valueEn}</b><span>${esc(T(l.label))}</span></div>`).join('');

  $('chaptersHead').textContent=T(D.chaptersHead);
  $('chapters').innerHTML=D.chapters.map(c=>`<div class="card" id="${c.icon}"><h3>${esc(T(c.title))}</h3><p>${esc(T(c.text))}</p><a href="#${c.icon}">${T(D.ui.learnMore)} →</a></div>`).join('');

  $('supportHead').textContent=T(D.supportHead);
  $('supportLead').textContent=T(D.supportLead);
  $('supportGrid').innerHTML=D.ledgerEntries.map(e=>`<div class="card"><h3>${esc(T(e.title))}</h3><p>${esc(T(e.note))}</p><span class="soon-badge">${T(D.footer.soonLabel)}</span></div>`).join('');

  $('portalTitle').textContent=T(D.portal.title);
  $('portalTitleEn').textContent=lang==='bn'?D.portal.title.en:'';
  $('portalDesc').textContent=T(D.portal.desc);
  $('portalCta').textContent=T(D.portal.cta);

  $('footerNote').textContent=T(D.footer.note);
  $('footerCredit').textContent='© ২০২৬ কোরআনের ফেরিওয়ালা — '+D.footer.credit;
  $('footerLegal').textContent=D.footer.legal.map(l=>T(l.label)).join(' · ');
  $('footerCols').innerHTML=D.footer.columns.map(col=>`<div class="foot-col"><h4>${esc(T(col.heading))}</h4>${col.links.map(l=>l.soon?`<span class="soon">${esc(T(l.label))}<span class="soon-badge">${T(D.footer.soonLabel)}</span></span>`:`<a href="${l.link}">${esc(T(l.label))}</a>`).join('')}</div>`).join('');
}
function setLang(l){lang=l;try{localStorage.setItem('qfLang',l)}catch(e){}render()}
async function init(){
  let saved=null;try{saved=localStorage.getItem('qfLang')}catch(e){}
  const r=await fetch('data.json',{cache:'no-store'});D=await r.json();
  lang=saved==='en'||saved==='bn'?saved:'bn';
  render();
}
$('lBn').onclick=()=>setLang('bn');$('lEn').onclick=()=>setLang('en');
init();
</script>
</body>
</html>
