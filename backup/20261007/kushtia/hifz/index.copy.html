<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a3a31">
<title>হিফজ ব্যবস্থাপনা, কুষ্টিয়া জেলা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--night:#0a3a31;--em:#136b55;--gold:#b8892d;--gsoft:#ead9a6;--bg:#f1f5f0;--card:#fff;--ink:#15221d;--muted:#586a62;--line:#d5ddd3;--warn:#a12b2b;--serif:'Tiro Bangla',Georgia,serif;--sans:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;--star:polygon(50% 0,64.6% 14.6%,85.4% 14.6%,85.4% 35.4%,100% 50%,85.4% 64.6%,85.4% 85.4%,64.6% 85.4%,50% 100%,35.4% 85.4%,14.6% 85.4%,14.6% 64.6%,0 50%,14.6% 35.4%,14.6% 14.6%,35.4% 14.6%)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a16;--card:#12261f;--ink:#e6efe9;--muted:#9db1a7;--line:#244036;--warn:#f0a29a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans)}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 50% 0,#12604e,var(--night) 62%)}
.lc{width:100%;max-width:420px;background:var(--card);border-top:4px solid var(--gold);border-radius:4px;padding:28px 22px;text-align:center}
.lc .g{margin:0;font:1.1rem var(--serif);color:var(--gold)}
.lc h1{margin:0;font:400 1.9rem/1.3 var(--serif);color:var(--em)}
.lc p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.lc input{width:100%;margin-top:16px;padding:11px 14px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:4px;background:var(--em);color:#fff;font:600 1.05rem var(--sans);cursor:pointer}
#msg{min-height:1.7em;margin-top:8px;color:var(--warn);font-size:.92rem}
.ct{margin-top:10px!important;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem!important}
.hero{background:linear-gradient(180deg,var(--night),#0e4a3e);color:#fff;padding:18px 18px 28px;border-bottom:4px solid var(--gold)}
.hin{max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--gsoft);font-weight:600;font-size:.95rem}
.top a{color:var(--gsoft);text-decoration:none;border:1px solid var(--gsoft);border-radius:999px;padding:2px 14px}
.who{display:flex;gap:16px;align-items:center;margin-top:18px}
.av{width:84px;height:84px;flex:none;background:var(--gold);clip-path:var(--star);display:grid;place-items:center}
.av i{width:76px;height:76px;background:var(--em);clip-path:var(--star);display:grid;place-items:center;font:normal 2.2rem var(--serif);color:var(--gsoft)}
.who h1{margin:0;font:400 clamp(1.8rem,6vw,2.6rem)/1.25 var(--serif)}
.pill{display:inline-block;margin-top:4px;border:1px solid rgba(234,217,166,.55);color:var(--gsoft);padding:1px 12px;border-radius:999px;font-size:.9rem}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav div{max-width:960px;margin:0 auto;display:flex}
nav button{flex:1 0 auto;padding:12px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:600 1rem var(--sans);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--em);border-color:var(--gold)}
main{max-width:960px;margin:0 auto;padding:4px 16px 48px}
h2{font:400 1.4rem/1.3 var(--serif);margin:28px 0 10px;display:flex;gap:12px;align-items:center}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.asof{color:var(--muted);font-size:.88rem;margin-top:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:10px 14px;border-radius:4px}
.k small{color:var(--muted);display:block;font-size:.85rem;line-height:1.4}
.k b{font:400 1.9rem/1.3 var(--serif)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--muted);font-weight:500;font-size:.85rem}
tr.row{cursor:pointer}tr.row:hover td,tr.row.on td{background:rgba(184,137,45,.12)}
.bar{display:inline-block;width:60px;height:8px;background:var(--line);border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar s{display:block;height:100%;background:var(--em)}.bar.lo s{background:var(--warn)}
.dim{color:var(--muted)}
.det{padding:14px 16px;background:var(--card);border-left:4px solid var(--gold);margin-top:12px;border-radius:0 4px 4px 0}
.al{padding:10px 14px;border-left:4px solid var(--warn);background:var(--card);margin-bottom:8px;border-radius:0 4px 4px 0}
.al b{color:var(--warn)}
.empty{padding:14px 16px;background:var(--card);border:1px dashed var(--line);border-radius:4px;color:var(--muted)}
.tl{display:grid;gap:10px}
.lv{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);padding:12px 14px;border-radius:4px}
.lv.me{border:2px solid var(--gold)}
.no{width:34px;height:34px;background:var(--em);clip-path:var(--star);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:600}
.lv.me .no{background:var(--gold)}
.lv h3{margin:0;font:600 1.05rem var(--sans)}
.lv p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}.lv p b{color:var(--ink);font-weight:500}
.out{margin-top:20px;background:none;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:4px;cursor:pointer;font:inherit}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 32px}
#err{max-width:420px;background:var(--card);border-top:4px solid var(--warn);padding:20px;color:var(--warn)}
</style>
</head>
<body>
<section id="lock">
  <div class="lc hidden" id="lc">
    <p class="g" id="lGreet"></p><h1 id="lTitle"></h1>
    <p><b id="lFor"></b></p><p id="lSub"></p>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="go"></button>
    <div id="msg" role="alert"></div>
    <p class="ct"><span id="lNote"></span> <b id="lMail"></b></p>
  </div>
  <div id="err" class="hidden" role="alert"></div>
</section>

<div id="app" class="hidden">
  <header class="hero"><div class="hin">
    <div class="top"><span id="brand"></span><a id="back" href="../"></a></div>
    <div class="who"><div class="av"><i id="mono"></i></div>
      <div><h1 id="oName"></h1><span class="pill" id="oRole"></span></div></div>
  </div></header>
  <nav><div role="tablist">
    <button role="tab" data-t="ov" aria-selected="true">সারসংক্ষেপ</button>
    <button role="tab" data-t="up" aria-selected="false">উপজেলা পর্যবেক্ষণ</button>
    <button role="tab" data-t="st" aria-selected="false">দায়িত্ব কাঠামো</button>
  </div></nav>
  <main>
    <div class="asof" id="asof"></div>
    <section id="ov"></section><section id="up" class="hidden"></section><section id="st" class="hidden"></section>
    <button class="out" id="out">বের হন</button>
  </main>
  <footer id="foot"></footer>
</div>

<script>
let D=null,sel=0;
const $=id=>document.getElementById(id);
const bn=n=>Number(n).toLocaleString('bn-BD');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b>0?Math.round(a/b*100):null;
const sum=k=>D.upazilas.reduce((a,u)=>a+(+u[k]||0),0);
const fmt=v=>v==null?'<span class="dim">—</span>':bn(v)+'%';
const bar=v=>v==null?'<span class="dim">—</span>':`<span class="bar ${v<75?'lo':''}"><s style="width:${v}%"></s></span>${bn(v)}%`;
const list=a=>a.map(u=>u.name).join('، ');

function ov(){
  const U=D.upazilas,sp=pct(sum('sabakDone'),sum('sabakTotal')),mp=pct(sum('mashqDone'),sum('mashqTotal'));
  const noHead=U.filter(u=>!u.head),noMad=U.filter(u=>!(+u.madrasa)),
        low=U.filter(u=>{const p=pct(u.mashqDone,u.mashqTotal);return p!=null&&p<75});
  const al=[];
  if(noHead.length)al.push(`<b>দায়িত্বশীল নির্ধারিত হয়নি:</b> ${list(noHead)}`);
  if(noMad.length)al.push(`<b>নিবন্ধিত মাদ্রাসা নেই:</b> ${list(noMad)}`);
  if(low.length)al.push(`<b>মাশক জমার হার ৭৫% এর নিচে:</b> ${list(low)}`);
  $('ov').innerHTML=`
  <h2>জেলার সারসংক্ষেপ</h2>
  <div class="kpi">
    <div class="k"><small>নিবন্ধিত মাদ্রাসা</small><b>${bn(sum('madrasa'))}</b></div>
    <div class="k"><small>নিবন্ধিত হিফজ শিক্ষার্থী</small><b>${bn(sum('students'))}</b></div>
    <div class="k"><small>নিযুক্ত হিফজ উস্তাদ</small><b>${bn(sum('ustad'))}</b></div>
    <div class="k"><small>সবক সম্পন্নের হার</small><b>${fmt(sp)}</b></div>
    <div class="k"><small>মাশক জমার হার</small><b>${fmt(mp)}</b></div>
  </div>
  <h2>মনোযোগ প্রয়োজন</h2>
  ${al.length?al.map(t=>`<div class="al">${t}</div>`).join(''):'<div class="empty">এই মুহূর্তে কোনো বিষয় মনোযোগের অপেক্ষায় নেই।</div>'}
  <h2>প্রশিক্ষণ ও পরিদর্শন</h2>
  ${D.schedule.length?`<div class="card"><table style="min-width:0">${D.schedule.map(s=>`<tr><td>${esc(s.when)}</td><td>${esc(s.title)}</td></tr>`).join('')}</table></div>`:'<div class="empty">কোনো প্রশিক্ষণ বা পরিদর্শন কর্মসূচি এখনো যুক্ত করা হয়নি।</div>'}`;
}
function up(){
  const U=D.upazilas,u=U[sel],sp=pct(u.sabakDone,u.sabakTotal),mp=pct(u.mashqDone,u.mashqTotal);
  let d;
  if(+u.madrasa&&+u.students){d=`প্রতি মাদ্রাসায় গড়ে ${bn(Math.round(u.students/u.madrasa))} জন শিক্ষার্থী।`+(+u.ustad?` প্রতি উস্তাদের অধীনে গড়ে ${bn(Math.round(u.students/u.ustad))} জন।`:' হিফজ উস্তাদ এখনো নিবন্ধিত হয়নি।')+(mp!=null&&mp<75?' মাশক জমার হার কম, তাই এই উপজেলায় অগ্রাধিকার দিয়ে পরিদর্শন করা প্রয়োজন।':'')}
  else d='এই উপজেলায় এখনো মাদ্রাসা বা শিক্ষার্থী নিবন্ধিত হয়নি। মাদ্রাসা নিবন্ধন হলে এখানে বিশ্লেষণ দেখা যাবে।';
  $('up').innerHTML=`
  <h2>উপজেলাভিত্তিক পর্যবেক্ষণ</h2>
  <div class="card"><table>
    <tr><th>উপজেলা</th><th>দায়িত্বশীল</th><th>মাদ্রাসা</th><th>শিক্ষার্থী</th><th>উস্তাদ</th><th>সবক</th><th>মাশক</th></tr>
    ${U.map((x,i)=>`<tr class="row ${i===sel?'on':''}" data-i="${i}" tabindex="0"><td><b>${esc(x.name)}</b></td><td>${x.head?esc(x.head):'<span class="dim">নির্ধারিত হয়নি</span>'}</td><td>${bn(x.madrasa)}</td><td>${bn(x.students)}</td><td>${bn(x.ustad)}</td><td>${bar(pct(x.sabakDone,x.sabakTotal))}</td><td>${bar(pct(x.mashqDone,x.mashqTotal))}</td></tr>`).join('')}
  </table></div>
  <div class="det"><b>${esc(u.name)}</b><br>${d}</div>`;
  document.querySelectorAll('#up .row').forEach(e=>{const f=()=>{sel=+e.dataset.i;up()};e.onclick=f;e.onkeydown=k=>{if(k.key==='Enter')f()}});
}
function st(){
  $('st').innerHTML=`<h2>দায়িত্বশীল কাঠামো</h2>
  <p class="dim" style="margin:0 0 12px">প্রত্যেক স্তরের নিজস্ব পাসওয়ার্ডভিত্তিক ড্যাশবোর্ড থাকবে। একজন দায়িত্বশীল কেবল নিজের এলাকা ও তার নিচের স্তরের তথ্য দেখতে ও নিয়ন্ত্রণ করতে পারবেন।</p>
  <div class="tl">${D.levels.map((l,i)=>`<div class="lv ${l.me?'me':''}"><div class="no">${bn(i+1)}</div><div><h3>${esc(l.title)}${l.me?' (আপনি)':''}</h3><p><b>এলাকা:</b> ${esc(l.area)}</p><p><b>দেখবেন:</b> ${esc(l.sees)}</p><p><b>নিয়ন্ত্রণ:</b> ${esc(l.controls)}</p></div></div>`).join('')}</div>`;
}
function show(t){
  ['ov','up','st'].forEach(id=>$(id).classList.toggle('hidden',id!==t));
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
}
async function sha256Hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function unlock(){
  $('msg').textContent='';
  let ok=false;
  try{ok=(await sha256Hex($('pw').value.trim()))===String(D.security.passwordSha256).toLowerCase()}catch(e){}
  if(!ok){$('msg').textContent=D.lockScreen.wrongPassword;$('pw').select();return}
  $('pw').value='';$('lock').classList.add('hidden');$('app').classList.remove('hidden');
  ov();up();st();window.scrollTo(0,0);
}
function lock(){$('app').classList.add('hidden');$('lock').classList.remove('hidden');$('pw').focus()}
async function init(){
  try{
    const r=await fetch('data.json',{cache:'no-store'});if(!r.ok)throw 0;D=await r.json();
  }catch(e){$('err').textContent='তথ্য ফাইল (data.json) লোড করা যায়নি। পাতাটি ওয়েব সার্ভার থেকে খুলুন এবং data.json একই ফোল্ডারে আছে কি না দেখুন।';$('err').classList.remove('hidden');return}
  const L=D.lockScreen,O=D.official;
  document.title=D.site.title;
  $('lGreet').textContent=L.greeting;$('lTitle').textContent=L.title;$('lFor').textContent=L.profileFor;$('lSub').textContent=L.subtitle;
  $('pw').placeholder=L.placeholder;$('pw').setAttribute('aria-label',L.placeholder);$('go').textContent=L.button;
  $('lNote').textContent=L.contactNote;$('lMail').textContent=L.contactEmail;
  $('brand').textContent=D.site.brand+' · '+D.site.department;
  $('back').textContent='বিনিয়োগ প্রোফাইলে যান';$('back').href=D.site.profileUrl;
  $('mono').textContent=O.monogram;$('oName').textContent=O.name;$('oRole').textContent=O.role;
  $('asof').textContent=O.asOf?'তথ্য হালনাগাদ: '+O.asOf:'';
  $('foot').textContent='© '+bn(2026)+' '+D.site.brand+'। সর্বস্বত্ব সংরক্ষিত।';
  $('lc').classList.remove('hidden');$('pw').focus();
}
$('go').onclick=unlock;
$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
$('out').onclick=lock;
init();
</script>
</body>
</html>
