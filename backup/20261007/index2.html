<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হিফজ খানা</title>
<meta http-equiv="refresh" content="2.6; url=home/index.html">
<link rel="icon" href="https://mj-ahmad.github.io/qf/assets/logo.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#0a0a0a;
  display:grid;place-items:center;overflow:hidden;
}
.logo{
  width:120px;height:120px;object-fit:contain;
  opacity:0;transform:scale(.72);
  animation:boot 1.15s cubic-bezier(.22,.8,.32,1) forwards, hold 1s ease-in-out .95s forwards;
}
@keyframes boot{
  0%{opacity:0;transform:scale(.72)}
  55%{opacity:1;transform:scale(1.045)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes hold{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.18)}
  100%{filter:brightness(1)}
}
@media (prefers-reduced-motion:reduce){
  .logo{animation:none;opacity:1;transform:scale(1)}
}
</style>
</head>
<body>
<img class="logo" src="https://mj-ahmad.github.io/qf/assets/logo.png" alt="হিফজ খানা">
<noscript><meta http-equiv="refresh" content="0; url=home/index.html"></noscript>
<script>
setTimeout(function(){ window.location.replace('home/index.html'); }, 2600);
</script>
</body>
</html>
