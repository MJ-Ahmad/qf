<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quraner Fariwala</title>
<link rel="icon" href="https://mj-ahmad.github.io/qf/assets/logo.png" />
<meta http-equiv="refresh" content="4.2; url=home/index.html" />
<style>
  :root{
    --bg1:#05060a;
    --bg2:#07121a;
    --accent:#00e6c3;
    --muted:#cfd8dc;
    --duration:2200ms;
    --ease:cubic-bezier(.22,.8,.32,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Bengali",sans-serif}
  body{
    background: radial-gradient(1200px 600px at 10% 20%, rgba(0,230,195,0.06), transparent 8%),
                radial-gradient(900px 400px at 90% 80%, rgba(0,120,255,0.03), transparent 10%),
                linear-gradient(180deg,var(--bg1),var(--bg2));
    overflow:hidden;
    display:grid;
    place-items:center;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    perspective:1200px;
  }

  /* container */
  .splash{
    width:min(86vw,520px);
    max-width:520px;
    text-align:center;
    color:var(--muted);
    transform-style:preserve-3d;
    will-change:transform,opacity;
    pointer-events:none;
  }

  /* subtle particle layer (pure CSS) */
  .particles{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.02) 0 2px, transparent 2px),
      radial-gradient(circle at 80% 70%, rgba(0,230,195,0.02) 0 2px, transparent 2px);
    background-size: 1200px 800px, 900px 600px;
    animation: drift 18s linear infinite;
    mix-blend-mode:screen;
  }
  @keyframes drift{
    0%{background-position:0% 0%, 0% 0%}
    50%{background-position:50% 30%, 30% 60%}
    100%{background-position:0% 0%, 0% 0%}
  }

  /* logo card */
  .card{
    position:relative;
    z-index:2;
    display:inline-grid;
    gap:18px;
    align-items:center;
    justify-items:center;
    padding:28px;
    border-radius:18px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    transform: translateZ(40px) rotateX(6deg);
  }

  /* logo wrapper for 3D tilt and slow reveal */
  .logo-wrap{
    width:150px;height:150px;
    display:grid;place-items:center;
    border-radius:50%;
    background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
    transform-style:preserve-3d;
    transition:transform 600ms var(--ease);
    will-change:transform,filter,opacity;
    opacity:0;
    transform: translateY(18px) scale(.86) rotateX(18deg);
    animation: reveal var(--duration) var(--ease) forwards;
  }

  .logo{
    width:86px;height:86px;object-fit:contain;border-radius:12px;
    transform-origin:center;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.6));
    transition:transform 900ms var(--ease), filter 900ms var(--ease);
    will-change:transform,filter;
    transform: translateZ(40px);
  }

  /* slow floating and sway */
  .logo-wrap::after{
    content:"";
    position:absolute;inset:auto 12px 12px 12px;border-radius:12px;
    height:6px;opacity:.12;
    background:linear-gradient(90deg, rgba(0,0,0,0.18), rgba(0,230,195,0.06));
    filter:blur(8px);
    transform:translateZ(-20px);
  }

  @keyframes reveal{
    0%{opacity:0;transform: translateY(18px) scale(.86) rotateX(18deg)}
    60%{opacity:1;transform: translateY(-6px) scale(1.06) rotateX(6deg)}
    100%{opacity:1;transform: translateY(0) scale(1) rotateX(0)}
  }

  /* gentle float */
  .float{
    animation: floaty 6.6s ease-in-out infinite;
  }
  @keyframes floaty{
    0%{transform: translateZ(40px) translateY(0) rotateZ(-1deg)}
    50%{transform: translateZ(40px) translateY(-8px) rotateZ(2deg)}
    100%{transform: translateZ(40px) translateY(0) rotateZ(-1deg)}
  }

  /* shimmer across logo */
  .shimmer{
    position:relative;overflow:hidden;border-radius:12px;
  }
  .shimmer::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.02) 60%);
    transform:translateX(-120%) skewX(-12deg);
    animation: shimmer 2.6s linear 1.1s forwards;
    mix-blend-mode:overlay;pointer-events:none;
  }
  @keyframes shimmer{
    to{transform:translateX(120%) skewX(-12deg)}
  }

  /* title and subtitle */
  .title{font-size:1.15rem;color:#fff;font-weight:600;letter-spacing:.2px;margin:0}
  .subtitle{font-size:.92rem;color:rgba(255,255,255,0.72);margin:0;opacity:0;transform:translateY(8px);animation: textIn 900ms var(--ease) 700ms forwards}
  @keyframes textIn{to{opacity:1;transform:translateY(0)}}

  /* progress ring */
  .ring{
    width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--accent) 0% 0%, rgba(255,255,255,0.04) 0% 100%);
    transform:translateZ(30px) scale(.96);
    opacity:.98;
    margin-top:6px;
    transition:background 300ms linear;
  }
  .ring .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 4px 12px rgba(0,230,195,0.18)}

  /* small helper text */
  .hint{font-size:.78rem;color:rgba(255,255,255,0.5);margin-top:12px}

  /* hover tilt on pointer devices */
  @media (hover:hover) and (pointer:coarse), (hover:hover) and (pointer:fine){
    .card:hover .logo-wrap{transform:translateY(-6px) rotateX(6deg) rotateY(6deg) scale(1.02)}
    .card:hover .logo{transform:translateZ(48px) rotateZ(2deg) scale(1.02);filter:drop-shadow(0 18px 40px rgba(0,230,195,0.12))}
  }

  /* reduced motion */
  @media (prefers-reduced-motion:reduce){
    .logo-wrap,.logo,.particles,.subtitle,.ring{animation:none;transition:none;transform:none;opacity:1}
  }
</style>
</head>
<body>
  <div class="particles" aria-hidden="true"></div>

  <div class="splash" role="status" aria-live="polite">
    <div class="card" aria-hidden="false">
      <div class="logo-wrap float shimmer" aria-hidden="true">
        <img class="logo" src="https://mj-ahmad.github.io/qf/assets/logo.png" alt="হিফজ খানা লোগো">
      </div>

      <h1 class="title">কোরআনের ফেরিওয়ালা </h1>
      <p class="subtitle"> লোড হচ্ছে — একটু অপেক্ষা করুন</p>

      <div class="ring" id="ring" aria-hidden="true">
        <div class="dot"></div>
      </div>

      <div class="hint"></div>
    </div>
  </div>

<script>
  // gentle progress simulation for ring
  (function(){
    const ring = document.getElementById('ring');
    let pct = 0;
    const duration = 3800; // total simulated load time in ms (matches meta refresh ~4.2s)
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      pct = Math.round(t * 100);
      // update conic gradient
      ring.style.background = `conic-gradient(var(--accent) 0 ${pct}%, rgba(255,255,255,0.04) ${pct}% 100%)`;
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    // subtle parallax tilt based on device orientation or pointer
    const wrap = document.querySelector('.logo-wrap');
    function onMove(x,y){
      const w = window.innerWidth, h = window.innerHeight;
      const rx = (y - h/2) / (h/2); // -1..1
      const ry = (x - w/2) / (w/2);
      const max = 8; // degrees
      wrap.style.transform = `translateY(-6px) rotateX(${rx*max}deg) rotateY(${ry*max}deg) scale(1.02)`;
    }

    // pointer move for desktops
    if(window.matchMedia('(pointer:fine)').matches){
      window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY), {passive:true});
    } else if(window.DeviceOrientationEvent){
      // device tilt for mobiles
      window.addEventListener('deviceorientation', e => {
        const gamma = e.gamma || 0; // left-right
        const beta = e.beta || 0;   // front-back
        const rx = Math.max(-1, Math.min(1, beta/30));
        const ry = Math.max(-1, Math.min(1, gamma/30));
        const max = 8;
        wrap.style.transform = `translateY(-6px) rotateX(${rx*max}deg) rotateY(${ry*max}deg) scale(1.02)`;
      }, true);
    }

    // accessibility: respect reduced motion by disabling parallax
    const mq = window.matchMedia('(prefers-reduced-motion:reduce)');
    if(mq.matches){
      wrap.style.transform = '';
      window.removeEventListener('mousemove', onMove);
    }

    // final redirect safety: ensure redirect happens even if JS disabled via meta refresh
    // (no extra action needed here)
  })();
</script>
</body>
</html>
