<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="কোরআনের ফেরিওয়ালা — গবেষণা, মুদ্রণ, বিতরণ ও হিফজ শিক্ষা ব্যবস্থাপনার একটি উদ্যোগ।"
  >

  <meta
    name="author"
    content="MJ-Ahmad"
  >

  <meta
    name="theme-color"
    content="#07151b"
  >

  <meta
    http-equiv="refresh"
    content="4.2; url=home/index.html"
  >

  <title>কোরআনের ফেরিওয়ালা — QuranerFariwala</title>

  <link
    rel="icon"
    href="assets/logo.png"
    type="image/png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background-start: #03070a;
      --background-end: #07151b;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f5faf8;
      --muted: rgba(245, 250, 248, 0.72);
      --soft: rgba(245, 250, 248, 0.5);
      --gold: #d9b96e;
      --gold-light: #f2dfa4;
      --green: #14866e;
      --green-light: #26c59e;
      --focus: #ffe08a;
      --serif: "Tiro Bangla", Georgia, serif;
      --sans: "Hind Siliguri", system-ui, sans-serif;
      --duration: 4200ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
      color: var(--text);
      font-family: var(--sans);
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(23, 134, 110, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(217, 185, 110, 0.08),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          var(--background-start),
          var(--background-end)
        );
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .background-pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image:
        radial-gradient(
          circle at 20% 30%,
          rgba(255, 255, 255, 0.08) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle at 75% 70%,
          rgba(38, 197, 158, 0.08) 0 1px,
          transparent 1.5px
        );
      background-size: 170px 170px, 230px 230px;
      animation: patternMove 24s linear infinite;
    }

    @keyframes patternMove {
      0% {
        background-position: 0 0, 0 0;
      }

      50% {
        background-position: 80px 50px, -60px 90px;
      }

      100% {
        background-position: 0 0, 0 0;
      }
    }

    .glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.14;
    }

    .glow-one {
      top: -140px;
      left: -100px;
      background: var(--green-light);
    }

    .glow-two {
      right: -130px;
      bottom: -150px;
      background: var(--gold);
    }

    .splash-wrapper {
      width: min(92vw, 540px);
      position: relative;
      z-index: 2;
      padding: 1rem;
      text-align: center;
    }

    .splash-card {
      padding: clamp(2rem, 7vw, 3.5rem) clamp(1.4rem, 6vw, 3rem);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.08),
        var(--panel)
      );
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn 900ms cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-frame {
      width: 154px;
      height: 154px;
      margin: 0 auto 1.4rem;
      display: grid;
      place-items: center;
      position: relative;
      border: 1px solid rgba(242, 223, 164, 0.35);
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.02) 68%
        );
      box-shadow:
        0 0 0 10px rgba(217, 185, 110, 0.04),
        0 0 45px rgba(217, 185, 110, 0.14);
      animation: logoFloat 5.5s ease-in-out infinite;
    }

    .logo-frame::before,
    .logo-frame::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(217, 185, 110, 0.16);
      border-radius: 50%;
    }

    .logo-frame::after {
      inset: -10px;
      border-color: rgba(38, 197, 158, 0.1);
    }

    .logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      border-radius: 16px;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0) rotate(-1deg);
      }

      50% {
        transform: translateY(-9px) rotate(1deg);
      }
    }

    .arabic-title {
      margin: 0;
      color: var(--gold-light);
      font: 400 clamp(2rem, 8vw, 3rem) / 1.35 var(--serif);
      letter-spacing: 0.04em;
    }

    .arabic-subtitle {
      margin: 0.35rem 0 1.25rem;
      color: var(--muted);
      font: 400 clamp(1rem, 4vw, 1.25rem) / 1.7 var(--serif);
    }

    .brand-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.25rem, 5vw, 1.7rem);
      font-weight: 700;
    }

    .brand-title-en {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.98rem;
      letter-spacing: 0.03em;
    }

    .loading-area {
      width: min(100%, 280px);
      margin: 2rem auto 1.25rem;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--green-light),
        var(--gold-light)
      );
      box-shadow: 0 0 18px rgba(38, 197, 158, 0.45);
      animation: progress var(--duration) linear forwards;
    }

    @keyframes progress {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    .loading-label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.65rem;
      color: var(--soft);
      font-size: 0.85rem;
    }

    .loading-label strong {
      color: var(--gold-light);
      font-weight: 600;
    }

    .enter-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      min-height: 44px;
      padding: 0.65rem 1.2rem;
      border: 1px solid rgba(242, 223, 164, 0.45);
      border-radius: 999px;
      color: #171207;
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .enter-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    .hint {
      margin: 1rem 0 0;
      color: var(--soft);
      font-size: 0.8rem;
    }

    .footer-note {
      margin: 1rem 0 0;
      color: rgba(245, 250, 248, 0.42);
      font-size: 0.75rem;
    }

    .footer-note a {
      color: rgba(242, 223, 164, 0.68);
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .splash-wrapper {
        width: 94vw;
        padding: 0.5rem;
      }

      .splash-card {
        border-radius: 20px;
      }

      .logo-frame {
        width: 132px;
        height: 132px;
      }

      .logo {
        width: 80px;
        height: 80px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .progress-bar {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="background-pattern" aria-hidden="true"></div>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main
    class="splash-wrapper"
    role="main"
    aria-labelledby="splash-title"
  >
    <section class="splash-card">
      <div class="logo-frame">
        <img
          class="logo"
          src="assets/logo.png"
          alt="কোরআনের ফেরিওয়ালা লোগো"
          width="92"
          height="92"
        >
      </div>

      <h1 class="arabic-title" id="splash-title">
        القرآن
      </h1>

      <p class="arabic-subtitle">
        هُوَ كَلَامُ الرَّحْمَنِ
      </p>

      <h2 class="brand-title">
        কোরআনের ফেরিওয়ালা
      </h2>

      <p class="brand-title-en">
        Quraner Fariwala
      </p>

      <div
        class="loading-area"
        role="status"
        aria-live="polite"
        aria-label="হোম পেজ লোড হচ্ছে"
      >
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>

        <div class="loading-label">
          <span>প্রবেশ প্রস্তুত হচ্ছে</span>
          <strong id="progressText">0%</strong>
        </div>
      </div>

      <a
        class="enter-link"
        href="home/index.html"
      >
        প্রবেশ করুন
        <span aria-hidden="true">&nbsp;→</span>
      </a>

      <p class="hint">
        You will be redirected automatically in a few seconds.
      </p>

      <p class="footer-note">
        গবেষণা · মুদ্রণ · বিতরণ · হিফজ শিক্ষা
        <br>
        <a
          href="https://github.com/MJ-Ahmad"
          target="_blank"
          rel="noopener noreferrer"
        >
          MJ-Ahmad
        </a>
      </p>
    </section>
  </main>

  <script>
    (function () {
      const homeUrl = 'home/index.html';
      const progressText = document.getElementById('progressText');
      const duration = 4200;
      const startTime = performance.now();

      function updateProgress(currentTime) {
        const elapsed = currentTime - startTime;
        const percentage = Math.min(
          100,
          Math.round((elapsed / duration) * 100)
        );

        if (progressText) {
          progressText.textContent = percentage + '%';
        }

        if (percentage < 100) {
          window.requestAnimationFrame(updateProgress);
        }
      }

      window.requestAnimationFrame(updateProgress);

      window.setTimeout(function () {
        window.location.href = homeUrl;
      }, duration);
    })();
  </script>
</body>
</html>
