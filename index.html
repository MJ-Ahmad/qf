<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হিফজ খানা</title>
<meta http-equiv="refresh" content="2.8; url=home/index.html">
<link rel="icon" href="https://mj-ahmad.github.io/qf/assets/logo.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background: linear-gradient(135deg,#0a0a0a,#1a1a1a,#0a0a0a);
  background-size: 400% 400%;
  animation: bgmove 6s ease infinite;
  display:grid;place-items:center;overflow:hidden;
}
.logo{
  width:140px;height:140px;object-fit:contain;
  opacity:0;transform:scale(.7) rotate(-12deg);
  animation:
    boot 1.4s cubic-bezier(.22,.8,.32,1) forwards,
    glow 2.4s ease-in-out 1.2s infinite alternate;
}
.loading-text{
  margin-top:20px;
  font-size:1.1em;
  color:#fff;
  font-family:sans-serif;
  letter-spacing:1px;
  opacity:0;
  animation: fadeInText 1.6s ease forwards 1.2s, pulse 1.8s infinite 2.2s;
}
@keyframes boot{
  0%{opacity:0;transform:scale(.7) rotate(-12deg)}
  60%{opacity:1;transform:scale(1.08) rotate(6deg)}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}
@keyframes glow{
  from{filter:drop-shadow(0 0 4px #fff)}
  to{filter:drop-shadow(0 0 18px #00ffcc)}
}
@keyframes fadeInText{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes pulse{
  0%{opacity:.6}
  50%{opacity:1}
  100%{opacity:.6}
}
@keyframes bgmove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@media (prefers-reduced-motion:reduce){
  .logo,.loading-text{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
  <div class="splash-container">
    <img class="logo" src="https://mj-ahmad.github.io/qf/assets/logo.png" alt="হিফজ খানা">
    <p class="loading-text">লোড হচ্ছে...</p>
  </div>
<noscript><meta http-equiv="refresh" content="0; url=home/index.html"></noscript>
<script>
setTimeout(function(){ window.location.replace('home/index.html'); }, 2800);
</script>
</body>
</html>
