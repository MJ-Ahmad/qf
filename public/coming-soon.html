<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শীঘ্রই আসছে · MJ Ahmad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .panel {
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 2.5rem 1.75rem;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      background: linear-gradient(160deg, #1a1a1a, #141414);
    }
    .badge-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff9800;
      box-shadow: 0 0 0 6px rgba(255, 152, 0, 0.15);
      margin-bottom: 1.25rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.15); }
      50% { box-shadow: 0 0 0 10px rgba(255, 152, 0, 0.05); }
    }
    .page-name {
      color: #ff9800;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .desc {
      color: #9e9e9e;
      line-height: 1.8;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .btn-accent {
      background: #ff9800;
      color: #121212;
      border: 0;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn-accent:hover, .btn-accent:focus-visible {
      color: #121212;
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .btn-ghost {
      border: 1px solid #3a3a3a;
      color: #e0e0e0;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .btn-ghost:hover, .btn-ghost:focus-visible {
      border-color: #ff9800;
      color: #ff9800;
    }
    .lang-toggle {
      text-align: center;
      padding-bottom: 1.5rem;
    }
    .lang-toggle button {
      background: none;
      border: 0;
      color: #9e9e9e;
      padding: 4px 8px;
      font-size: 0.9rem;
      border-bottom: 2px solid transparent;
    }
    .lang-toggle button[aria-pressed="true"] {
      color: #ff9800;
      border-bottom-color: #ff9800;
    }
  </style>
</head>
<body>

<div class="lang-toggle pt-3">
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
  <button type="button" data-lang="bn" aria-pressed="true">বাংলা</button>
  <button type="button" data-lang="ar" aria-pressed="false">AR</button>
</div>

<main class="stage">
  <div class="panel">
    <span class="badge-dot" aria-hidden="true"></span>
    <p class="page-name" id="page-name"></p>
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
    <div class="actions">
      <a class="btn-accent" id="mail" href="mailto:mjahmad2024@outlook.com">ইমেইল পাঠান</a>
      <a class="btn-ghost" id="home" href="index.html">হোম পেইজে ফিরুন</a>
    </div>
  </div>
</main>

<script>
  const copy = {
    en: {
      title: "Coming soon",
      desc: "This page is being prepared. Until then, you can reach out directly by email.",
      mail: "Send email", home: "Back to home",
      pages: { feedback: "Feedback", suggestion: "Suggestions", complaint: "Complaints" }
    },
    bn: {
      title: "শীঘ্রই আসছে",
      desc: "এই পেইজটি প্রস্তুত করা হচ্ছে। ইতিমধ্যে সরাসরি ইমেইলে আপনার মতামত জানাতে পারেন।",
      mail: "ইমেইল পাঠান", home: "হোম পেইজে ফিরুন",
      pages: { feedback: "ফিডব্যাক", suggestion: "পরামর্শ", complaint: "অভিযোগ" }
    },
    ar: {
      title: "قريباً",
      desc: "هذه الصفحة قيد الإعداد. في الوقت الحالي يمكنك التواصل معنا مباشرة عبر البريد الإلكتروني.",
      mail: "أرسل بريداً", home: "العودة إلى الصفحة الرئيسية",
      pages: { feedback: "ملاحظات", suggestion: "اقتراحات", complaint: "شكاوى" }
    }
  };

  const params = new URLSearchParams(window.location.search);
  const pageKey = copy.bn.pages[params.get("page")] ? params.get("page") : "feedback";

  function render(lang) {
    const c = copy[lang];
    const pageName = c.pages[pageKey];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = `${c.title} · ${pageName}`;
    document.getElementById("page-name").innerText = pageName;
    document.getElementById("title").innerText = c.title;
    document.getElementById("desc").innerText = c.desc;
    document.getElementById("mail").innerText = c.mail;
    document.getElementById("home").innerText = c.home;
    document.getElementById("mail").href =
      `mailto:mjahmad2024@outlook.com?subject=${encodeURIComponent(pageName)}`;
    document.querySelectorAll("[data-lang]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    localStorage.setItem("siteLang", lang);
  }

  document.querySelectorAll("[data-lang]").forEach((b) =>
    b.addEventListener("click", () => render(b.dataset.lang)));

  render(localStorage.getItem("siteLang") || "bn");
</script>

</body>
</html>
