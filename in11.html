<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>হিফজ খানা - Minimal Glow</title>
<meta http-equiv="refresh" content="3; url=home/index.html">
<style>
body{
  margin:0;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:#0a0a0a;
}
.logo{
  width:140px;height:140px;opacity:0;transform:scale(.8);
  animation:glowFade 2.2s ease forwards;
  filter:drop-shadow(0 0 12px #00e6c3);
}
@keyframes glowFade{
  0%{opacity:0;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.05)}
  100%{opacity:1;transform:scale(1)}
}
</style>
</head>
<body>
<img class="logo" src="https://mj-ahmad.github.io/qf/assets/logo.png" alt="হিফজ খানা">
</body>
</html>
